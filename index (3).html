window.addEventListener('error',function(e){var b=document.getElementById('errbar');if(!b){b=document.createElement('div');b.id='errbar';b.style.cssText='position:fixed;left:8px;right:8px;bottom:8px;z-index:99;background:#b3261e;color:#fff;padding:10px;border-radius:8px;font-size:13px;cursor:pointer';document.body.appendChild(b)}b.textContent='Error: '+(e.message||'unknown')+(e.lineno?' (line '+e.lineno+')':'')+'. Please send this message to the developer. Tap to hide.';b.onclick=function(){b.remove()}});

 if(AUTH==='lout'){$('nav').innerHTML='';$('hb').style.display='none';$('ub').innerHTML='';$('v').innerHTML=sbKeyCard()+lAuthHTML();return}
 if(AUTH==='out'){$('nav').innerHTML='';$('hb').style.display='none';$('ub').innerHTML='';$('v').innerHTML='<div class="card"><h2>Sign in</h2><p>Sign in with your Gmail account to open your own classes, marks and attendance from any phone or computer.</p><button class="pri" onclick="cloud.login().catch(function(e){alert(\'Sign-in failed: \'+e.message)})">Sign in with Google</button></div>';return}
 if(AUTH==='pending'||AUTH==='blocked'){$('nav').innerHTML='';$('hb').style.display='none';$('ub').innerHTML='';$('v').innerHTML='<div class="card"><h2>'+(AUTH==='pending'?'Waiting for approval':'Access not allowed')+'</h2><p>'+(AUTH==='pending'?'Your account ('+esc(cloud.user.email||'')+') is registered. The administrator must approve it before you can use the system. Please try again later.':'Your account is not approved. Please contact the administrator.')+'</p><button class="pri" onclick="window.dispatchEvent(new Event(\'authchange\'))">Check again</button> <button onclick="cloud.logout()">Sign out</button></div>';return}
 $('ub').innerHTML=AUTH==='in'?esc(cloud.user.email||'')+(cloud.isAdmin?' <b>(Admin)</b>':'')+' <button onclick="cloud.logout()">Sign out</button> <span id="sv">'+esc(ST)+'</span>':(LU?'Signed in as <b>'+esc(LU)+'</b> <button onclick="lOut()">Sign out</button> <span class="mu">Data is saved in this browser only – use the Backup tab.</span>':'<b class="bad">Not connected – data is saved in this browser only.</b> '+esc(window.cloudWhy||''));
 if(!db.profile)S.tab='prof';

 nav();$('v').innerHTML=({dash:dash,adm:adm,cmb:cmb,ntf:notify,prof:function(){return prof()+accCard()},setup:setup,stu:stu,marks:marks,att:att,ana:ana,cert:cert,rep:repTab,bak:bak,exm:exm})[S.tab]();if(S.tab==='exm')exmLoad();if(S.tab==='ana')drawCharts();if(S.tab==='dash')drawDash()}

function setup(){var c=C();
 var h='<div class="card"><h2>1. Classes</h2><div class="row"><input id="nc" placeholder="e.g. N1 A, P4 B, S2 C"><select id="nl"><option value="N">Nursery (N)</option><option value="P">Primary / Pre-primary (P)</option><option value="S" selected>Secondary (S)</option></select><button class="pri" onclick="addCls()">Add class</button></div>'+(db.classes.length?pick()+lvlSel()+clsEdit():'')+'</div>';

/* IMPORT */
function clean(s){return String(s||'').replace(/^\s*\d+[\.\)\-\s]+/,'').replace(/\s+/g,' ').trim()}

function xlNames(buf){var wb=XLSX.read(buf,{type:'array'}),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''}),col=-1;
 for(var r=0;r<Math.min(rows.length,10)&&col<0;r++)rows[r].forEach(function(v,i){if(col<0&&/name/i.test(String(v)))col=i});

function stuDone(st){var i=st.info||{},rw=!i.natl||/rwand/i.test(i.natl);

function stu(){var c=C();if(!c)return'<div class="card">Add a class in Setup first.</div>';
 var done=c.students.filter(stuDone).length;
 var h=pick()+'<div class="card"><h2>Student identities – '+esc(c.name)+'</h2><p class="mu">'+done+' of '+c.students.length+' complete. A student is complete when residence (province to isibo, for Rwandans) and at least one parent or guardian with a phone number are filled.</p><div class="row"><button class="pri" onclick="idPdf()">Export class identity register (PDF)</button></div><div class="sc"><table><tr><th>#</th><th>Student</th><th>Status</th><th></th></tr>'+

 if(st){var i=st.info||{};
  h+='<div class="card"><h2>Edit: '+esc(st.name)+'</h2><h2 class="mu" style="margin-top:8px">Student</h2><div class="fg">'+fld('name','Full names',{name:st.name})+'<label class="mu">Sex<br><select id="f_sex">'+opt2(['Female','Male'],i.sex,'Select')+'</select></label>'+'<label class="mu">Date of birth<br><input type="date" id="f_dob" value="'+esc(i.dob||'')+'"></label>'+fld('natl','Nationality',{natl:i.natl===undefined?'Rwandan':i.natl})+fld('regno','Student ID / reg. number',i)+'</div>'+

/* SUMMATIVE EXAMS: upload exam (opens at a set time) + marking scheme (released after the exam) */
var EXL=[];
function exLoc(iso){try{return new Date(iso).toLocaleString('en-GB',{dateStyle:'medium',timeStyle:'short'})}catch(e){return iso}}
function exLink(code){return location.origin+location.pathname+'#exam='+code}
function exDef(h){var d=new Date(Date.now()+h*3600000);d.setMinutes(0,0,0);var z=d.getTimezoneOffset()*60000;return new Date(d-z).toISOString().slice(0,16)}
function exm(){
 if(!window.cloud||!cloud.sb)return'<div class="card bad">Exams need the online (Supabase) connection. Sign in first.</div>';
 return'<div class="card"><h2>Upload summative assessment</h2>'+
 '<p class="mu">Students open the exam with a link at the time you set. The marking scheme stays locked until after the exam has ended. Time is enforced by the server, so it cannot be bypassed.</p>'+
 '<div class="row"><input id="xt" placeholder="Title e.g. Physics Summative – Term 1" style="min-width:260px"><select id="xc">'+db.classes.map(function(c){return'<option>'+esc(c.name)+'</option>'}).join('')+'</select><select id="xs">'+db.subjects.map(function(c){return'<option'+(S.sub===c.id?' selected':'')+'>'+esc(c.name)+'</option>'}).join('')+'</select></div>'+
 '<div class="row"><label class="mu">Exam opens<br><input id="xo" type="datetime-local" value="'+exDef(24)+'"></label><label class="mu">Exam ends<br><input id="xe" type="datetime-local" value="'+exDef(26)+'"></label><label class="mu">Marking scheme opens<br><input id="xm" type="datetime-local" value="'+exDef(27)+'"></label></div>'+
 '<div class="row"><label class="mu">Exam file (PDF, Word or image, max 4 MB)<br><input id="xf" type="file" accept=".pdf,.doc,.docx,image/*"></label><label class="mu">Marking scheme (optional, can be added later)<br><input id="xk" type="file" accept=".pdf,.doc,.docx,image/*"></label></div>'+
 '<div class="row"><button class="pri" onclick="exSave()">Upload exam</button></div><p id="xmsg" class="mu"></p></div>'+
 '<div class="card"><h2>My exams</h2><div id="exlist" class="mu">Loading…</div></div>'}
function exRead(f){return new Promise(function(res,rej){if(!f)return res(null);if(f.size>4*1024*1024)return rej(new Error('File "'+f.name+'" is larger than 4 MB.'));var r=new FileReader();r.onload=function(){var u=String(r.result||'');res({name:f.name,type:f.type||'application/octet-stream',b64:u.slice(u.indexOf(',')+1)})};r.onerror=function(){rej(new Error('Could not read the file.'))};r.readAsDataURL(f)})}
async function exSave(){
 var m=$('xmsg'),t=$('xt').value.trim(),o=$('xo').value,e=$('xe').value,k=$('xm').value;
 if(!t){m.textContent='Write a title.';return}
 if(!$('xf').files[0]){m.textContent='Choose the exam file.';return}
 if(!o||!e||!k){m.textContent='Set the three times.';return}
 var od=new Date(o),ed=new Date(e),kd=new Date(k);
 if(!(ed>od)){m.textContent='The exam must end after it opens.';return}
 if(kd<ed){m.textContent='The marking scheme cannot open before the exam ends.';return}
 try{m.textContent='Uploading…';
  var f=await exRead($('xf').files[0]),sc=await exRead($('xk').files[0]);
  var row={title:t,class_name:$('xc').value,subject:$('xs').value,open_at:od.toISOString(),end_at:ed.toISOString(),scheme_at:kd.toISOString(),exam_name:f.name,exam_type:f.type,exam_b64:f.b64};
  if(sc){row.scheme_name=sc.name;row.scheme_type=sc.type;row.scheme_b64=sc.b64}
  var r=await sbClient().from('exams').insert(row);if(r.error)throw r.error;
  m.textContent='Uploaded. Copy the student link below.';$('xt').value='';$('xf').value='';$('xk').value='';exmLoad()
 }catch(x){m.textContent='Failed: '+(x.message||x)+(/relation .*exams|exams.*not exist|schema cache/i.test(x.message||'')?' – run exams_setup.sql in Supabase first.':'')}}
async function exmLoad(){
 var el=$('exlist');if(!el||!window.cloud||!cloud.sb)return;
 var r=await sbClient().from('exams').select('id,code,title,class_name,subject,open_at,end_at,scheme_at,exam_name,scheme_name').order('open_at',{ascending:false});
 if(r.error){el.innerHTML='<span class="bad">Could not load exams: '+esc(r.error.message)+(/exams/i.test(r.error.message)?' – run exams_setup.sql in Supabase first.':'')+'</span>';return}
 EXL=r.data||[];if(!EXL.length){el.innerHTML='No exams uploaded yet.';return}
 var now=Date.now();
 el.innerHTML='<div class="sc"><table><tr><th>Exam</th><th>Class</th><th>Opens</th><th>Ends</th><th>Scheme opens</th><th>Scheme</th><th>Student link</th><th></th></tr>'+EXL.map(function(x,i){
  var st=now<new Date(x.open_at)?'Scheduled':now<new Date(x.end_at)?'<b>Open now</b>':'Ended';
  return'<tr><td>'+esc(x.title)+'<br><span class="mu">'+esc(x.subject||'')+' · '+st+'</span></td><td>'+esc(x.class_name||'')+'</td><td>'+exLoc(x.open_at)+'</td><td>'+exLoc(x.end_at)+'</td><td>'+exLoc(x.scheme_at)+'</td><td>'+(x.scheme_name?esc(x.scheme_name):'<span class="mu">none</span>')+'<br><input type="file" accept=".pdf,.doc,.docx,image/*" onchange="exScheme('+i+',this)"></td><td><button onclick="exCopy('+i+')">Copy link</button></td><td><button class="x" onclick="exDel('+i+')">Delete</button></td></tr>'}).join('')+'</table></div>'}
function exCopy(i){var l=exLink(EXL[i].code);if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(l).then(function(){alert('Link copied:\n'+l)},function(){prompt('Copy this link:',l)})}else prompt('Copy this link:',l)}
async function exScheme(i,inp){try{var f=await exRead(inp.files[0]);if(!f)return;var r=await sbClient().from('exams').update({scheme_name:f.name,scheme_type:f.type,scheme_b64:f.b64}).eq('id',EXL[i].id);if(r.error)throw r.error;alert('Marking scheme saved. It opens at '+exLoc(EXL[i].scheme_at)+'.');exmLoad()}catch(x){alert('Failed: '+(x.message||x))}}
async function exDel(i){if(!confirm('Delete "'+EXL[i].title+'" and its files? The student link will stop working.'))return;var r=await sbClient().from('exams').delete().eq('id',EXL[i].id);if(r.error){alert(r.error.message);return}exmLoad()}

/* Student page: https://your-site/#exam=CODE (no login needed) */
var EXI=null,EXOFF=0,EXT=null,EXC='';
function exStudent(){
 $('nav').innerHTML='';$('hb').style.display='none';$('ub').innerHTML='';
 var code=location.hash.replace('#exam=','').replace(/[^a-z0-9]/gi,'');
 if(!window.supabase||!window.supabase.createClient||!sbCfg()){$('v').innerHTML='<div class="card bad">Cannot connect. Check your internet and reload.</div>';return}
 if(EXC===code&&EXI){return exDraw()}
 EXC=code;$('v').innerHTML='<div class="card">Loading…</div>';
 sbClient().rpc('exam_info',{p_code:code}).then(function(r){
  if(r.error||!r.data){$('v').innerHTML='<div class="card bad"><h2>Exam not found</h2><p>Check the link with your teacher.</p></div>';return}
  EXI=r.data;EXOFF=new Date(EXI.now).getTime()-Date.now();exDraw();clearInterval(EXT);EXT=setInterval(exDraw,1000)})}
function exCnt(ms){var s=Math.max(0,Math.floor(ms/1000)),d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60);return(d?d+'d ':'')+h+'h '+m+'m '+(s%60)+'s'}
function exDraw(){
 if(!EXI||!/^#exam=/.test(location.hash)||!$('v'))return;var now=Date.now()+EXOFF,o=new Date(EXI.open_at),e=new Date(EXI.end_at),k=new Date(EXI.scheme_at);

 else{h+=(now<e?'<p><b>The exam is open.</b> It ends at '+exLoc(EXI.end_at)+' (in '+exCnt(e-now)+').</p>':'<p class="mu">The exam ended at '+exLoc(EXI.end_at)+'.</p>');
  h+=EXI.has_exam?'<p><button class="pri" onclick="exOpen(\'exam\')">Open exam paper</button></p>':'<p class="bad">No exam file attached.</p>'}
 h+='</div><div class="card"><h2>Marking scheme</h2>';
 if(now<k)h+='<p class="mu">Locked. It opens on <b>'+exLoc(EXI.scheme_at)+'</b>.</p>';
 else h+=EXI.has_scheme?'<p><button class="pri" onclick="exOpen(\'scheme\')">Open marking scheme</button></p>':'<p class="mu">The teacher has not uploaded the marking scheme yet.</p>';
 $('v').innerHTML=h+'</div><p id="exm2" class="bad"></p>'}

 var r=await sbClient().rpc('exam_file',{p_code:EXC,p_kind:kind});

/* Shared school system: every teacher's data is stored under teachers/<id>; the owner/Editor (Admin) can read all of it and approves teachers. */
(function(){var done=false;
 function off(w){if(!done){done=true;window.cloudWhy=(w&&w.message)||(typeof w==='string'?w:'')||'';window.dispatchEvent(new Event('cloudoff'))}}
 if(!window.claude||!claude.use){off('Open this page inside Claude (claude.ai) and sign in.');return}
 setTimeout(function(){off('Sign-in took too long. Reload the page.')},12000);
 Promise.all([claude.use('user'),claude.use('db')]).then(async function(r){
  var user=r[0],db=r[1];if(!user||!db){off('Storage is not available. Ask the owner to share the page with you as Contributor, then reload.');return}
  var me=await user.me();if(!me||!me.id){off('You are not signed in to Claude. Sign in, then reload.');return}
  var admin=false;try{admin=(await user.isOwner())||(await user.canEdit())}catch(e){}

  async function readP(base){var m=await db.doc(base+'/stms_meta').get();if(!m.exists)return null;var n=m.data().n,t='';
   for(var i=0;i<n;i++){var p=await db.doc(base+'/stms_p'+i).get();t+=p.exists?p.data().s:''}return JSON.parse(t)}
  var mine='teachers/'+me.id+'/s';
  window.cloud={user:{uid:me.id,email:me.name||'Teacher'},isAdmin:admin,
   login:function(){return Promise.resolve()},
   logout:function(){alert('You are signed in with your Claude account. To leave, sign out of Claude.')},

    var a=null;try{a=await db.doc('approvals/'+me.id).get()}catch(e){}
    if(a&&a.exists)return a.data().status||'pending';
    try{await db.doc('registry/'+me.id).set({created:Date.now()})}catch(e){}
    return'pending'},
   load:async function(){var d=await readP(mine);
    if(!d&&admin){try{d=await readP('data/users/'+me.id)}catch(e){}}  /* owner's earlier private data */
    return d},
   loadFor:function(uid){return readP('teachers/'+uid+'/s')},
   save:function(d){var p=q.then(async function(){var t=JSON.stringify(d),n=Math.max(1,Math.ceil(t.length/chunk));

   setStatus:function(uid,s){return db.doc('approvals/'+uid).set({status:s})}};
